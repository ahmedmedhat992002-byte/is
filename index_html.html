<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrepreneurship & Innovation - Interactive Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 45%, #6d28d9 100%);
    min-height: 100vh;
    color: #1f2937;
    padding: 20px;
  }
  .app { max-width: 780px; margin: 0 auto; }
  header {
    text-align: center;
    color: #fff;
    margin-bottom: 22px;
  }
  header h1 { font-size: 26px; margin-bottom: 6px; }
  header p { font-size: 15px; opacity: 0.85; }

  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 26px;
    margin-bottom: 18px;
  }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .chip {
    padding: 9px 16px;
    border-radius: 999px;
    border: 2px solid #ddd6fe;
    background: #f5f3ff;
    color: #5b21b6;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    transition: all .2s;
  }
  .chip.active { background: #6d28d9; color: #fff; border-color: #6d28d9; transform: scale(1.05); }
  .chip:hover { border-color: #6d28d9; }

  .stats-row { display:flex; justify-content:center; gap:10px; font-size: 13px; color:#6b7280; margin-bottom: 18px; }
  .stats-row b { color: #6d28d9; }

  #startBtn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(109,40,217,0.35);
    transition: transform .15s;
  }
  #startBtn:hover { transform: translateY(-2px); }
  #startBtn:disabled { opacity: .5; cursor: not-allowed; }

  /* Quiz screen */
  .hidden { display: none !important; }
  .top-bar { display:flex; align-items:center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .progress-wrap { flex:1; background:#eef0ff; border-radius: 999px; height: 10px; overflow:hidden; }
  .progress-bar { height:100%; background: linear-gradient(90deg,#7c3aed,#a78bfa); width:0%; transition: width .3s; }
  .score-badge { font-weight:700; color:#4f46e5; font-size:14px; white-space:nowrap; }
  .cat-tag { display:inline-block; background:#ede9fe; color:#6d28d9; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700; margin-bottom:12px; }

  .question { font-size: 18px; font-weight: 700; margin-bottom: 18px; line-height: 1.5; color:#111827; }
  .options { display:flex; flex-direction: column; gap:10px; }
  .option {
    text-align: left;
    padding: 13px 16px;
    border-radius: 12px;
    border: 2px solid #e5e7eb;
    background: #fafafa;
    cursor: pointer;
    font-size: 15px;
    transition: all .15s;
  }
  .option:hover:not(.locked) { border-color: #a78bfa; background: #f5f3ff; }
  .option.correct { background: #dcfce7; border-color: #22c55e; color:#166534; font-weight:700; }
  .option.wrong { background: #fee2e2; border-color: #ef4444; color:#991b1b; font-weight:700; }
  .option.locked { cursor: default; }

  .trick-box {
    margin-top: 16px;
    padding: 14px 16px;
    background: #fffbeb;
    border: 2px dashed #fbbf24;
    border-radius: 12px;
    direction: rtl;
    font-size: 14.5px;
    color: #92400e;
    display: none;
    animation: fadeIn .3s;
  }
  .trick-box b { color: #b45309; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(-5px);} to{opacity:1; transform:translateY(0);} }

  .question-block { margin-bottom: 26px; padding-bottom: 22px; border-bottom: 2px solid #f0f0f0; }
  .question-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .page-nav { display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .page-nav button {
    padding: 13px 18px;
    border: none;
    border-radius: 12px;
    background: #111827;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    flex: 1;
  }
  .page-nav button:hover:not(:disabled) { background: #374151; }
  .page-nav button:disabled { opacity: .4; cursor: not-allowed; }
  #pageIndicator { color: #6b7280; font-size: 13px; font-weight: 600; white-space: nowrap; }

  /* Results */
  .result-emoji { font-size: 56px; text-align:center; margin-bottom: 6px; }
  .result-score { text-align:center; font-size: 40px; font-weight: 800; color:#4f46e5; }
  .result-sub { text-align:center; color:#6b7280; margin-bottom: 20px; }
  .review-item { padding: 12px 14px; border-radius: 10px; background:#f9fafb; margin-bottom: 8px; border-right: 4px solid #e5e7eb; }
  .review-item.wrong { border-right-color: #ef4444; }
  .review-item .rq { font-weight:700; font-size: 14px; margin-bottom:4px; }
  .review-item .ra { font-size: 13px; color:#374151; }
  .review-item .ra .good { color:#166534; font-weight:700; }
  .review-item .ra .bad { color:#991b1b; font-weight:700; text-decoration: line-through; }

  #restartBtn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#7c3aed,#4f46e5);
    color:#fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 10px;
  }

  footer { text-align:center; color:#e5e7eb; font-size:12px; opacity:.7; margin-top: 10px; }

  /* Answer feedback popup */
  .option { position: relative; }
  .feedback-pop {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%) scale(0.6);
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    animation: feedbackPop 1.1s ease forwards;
    z-index: 5;
  }
  .feedback-pop.good { background: #16a34a; color: #fff; box-shadow: 0 6px 16px rgba(22,163,74,0.45); }
  .feedback-pop.bad { background: #dc2626; color: #fff; box-shadow: 0 6px 16px rgba(220,38,38,0.45); }

  @keyframes feedbackPop {
    0%   { opacity: 0; transform: translateY(-50%) scale(0.4) rotate(-6deg); }
    15%  { opacity: 1; transform: translateY(-50%) scale(1.25) rotate(2deg); }
    30%  { transform: translateY(-50%) scale(1) rotate(0deg); }
    75%  { opacity: 1; transform: translateY(-50%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-70%) scale(0.9) rotate(0deg); }
  }

  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .option.wrong { animation: shakeWrong .4s ease; }

  @keyframes popCorrect {
    0% { transform: scale(1); }
    30% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .option.correct { animation: popCorrect .35s ease; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🚀 Entrepreneurship & Innovation</h1>
    <p>Interactive review for the Entrepreneurship & Innovation lectures — Chapter 1 (Part 1), Chapter 2 (Parts 1-4), and Chapter 3 (Parts 1-3)</p>
  </header>

  <!-- SETUP SCREEN -->
  <div class="card" id="setupScreen">
    <div class="filters" id="filters"></div>
    <div class="stats-row" id="statsRow"></div>
    <button id="startBtn">Start Quiz 🎯</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="card hidden" id="quizScreen">
    <div class="top-bar">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="score-badge" id="scoreBadge">0 / 0</div>
    </div>
    <div id="questionsContainer"></div>
    <div class="page-nav">
      <button id="prevPageBtn">⬅ Previous</button>
      <span id="pageIndicator"></span>
      <button id="nextPageBtn">Next 10 ➡</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="card hidden" id="resultScreen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-score" id="resultScore">0%</div>
    <div class="result-sub" id="resultSub"></div>
    <div id="reviewList"></div>
    <button id="restartBtn">Restart Quiz 🔁</button>
  </div>

  <footer>Custom-designed study tool for Entrepreneurship and Innovation — Dr. Naguah Abdel Kader</footer>
</div>

<script>
const CATS = {
  c1p1: "Ch1•P1: Concept of Entrepreneurship",
  c2p1: "Ch2•P1: Psychological Theory",
  c2p2: "Ch2•P2: Sociological Theory",
  c2p3: "Ch2•P3: Economic Theory",
  c2p4: "Ch2•P4: Management Theory",
  c3p1: "Ch3•P1: Innovation Concept & Types",
  c3p2: "Ch3•P2: Change Management",
  c3p3: "Ch3•P3: Resistance & Strategies"
};

const QUESTIONS = [
// ===== Chapter 1 Part 1 =====
{cat:"c1p1", q:"According to the lecture, what is the sole guarantee behind a country's wealth?", opts:["Possessing natural resources","Exploiting resources properly","Having many banks","Government subsidies"], correct:1, trick:"الثروة مش معناها امتلاك موارد بس، لازم 'استغلال' الموارد صح — زي مصر عندها موارد وسكان كتير، بس الاستغلال هو المهم."},
{cat:"c1p1", q:"Which African country is cited as an example with huge human and resource wealth but suffers from underutilization?", opts:["Nigeria","South Africa","Kenya","Ghana"], correct:0, trick:"نيجيريا = أكبر سوق في أفريقيا، أكتر من 200 مليون نسمة، بس فيها بطالة وتضخم عالي."},
{cat:"c1p1", q:"Who defined unemployment as a situation where qualified, willing, and able individuals cannot find work at the prevailing wage?", opts:["Ghosse (2004)","McClelland","UNDP","Schumpeter"], correct:0, trick:"'غصة' (Ghosse) — كأن الشخص 'اتغصّ' من البطالة، وده كان سنة 2004."},
{cat:"c1p1", q:"Self-employment is best described as:", opts:["Working for an employer under contract","Working for oneself rather than for an employer","Receiving a fixed monthly salary","A form of wage labor"], correct:1, trick:"Self = نفسه، يعني الشخص شغال لنفسه مش لصاحب عمل."},
{cat:"c1p1", q:"Wage labor is best described as:", opts:["A self-initiated business","An agreement whereby an employer hires an employee for a salary under agreed terms","A risk-bearing investment","A form of innovation"], correct:1, trick:"Wage = أجر → عامل بأجر ثابت تحت شروط متفق عليها مع صاحب العمل."},
{cat:"c1p1", q:"Which of the following is NOT listed as a consequence of excessive reliance on wage labor?", opts:["Lack of creativity and innovation","Job insecurity","Fixed income","Higher risk-taking ability"], correct:3, trick:"العامل بالأجر عنده أمان أقل مش 'قدرة أعلى على تحمل المخاطرة' — دي صفة رائد الأعمال مش الموظف."},
{cat:"c1p1", q:"The UNDP (2010) defines entrepreneurship as:", opts:["The process of using private initiative to transform a business concept into a new venture","A psychological trait only","A government policy tool","An economic indicator"], correct:0, trick:"UNDP = برنامج الأمم المتحدة الإنمائي، ركز على 'المبادرة الخاصة' لتحويل الفكرة لمشروع."},
{cat:"c1p1", q:"According to Leff (in Anyanwu, 2012), entrepreneurship is best described as:", opts:["The capacity for innovation, investment and activities expansion in new markets, products and techniques","A purely financial activity","A government regulation","An act of pure imitation"], correct:0, trick:"ليف = 'Leff' زي 'Left' يعني سبق غيره بالابتكار والاستثمار في أسواق جديدة."},
{cat:"c1p1", q:"Stokes, Wilson and Mador (2010) categorized definitions of entrepreneurship into three dimensions. Which of the following is NOT one of them?", opts:["Behaviors","Processes","Outcomes","Regulations"], correct:3, trick:"الأبعاد التلاتة: سلوك (Behaviour) - عملية (Process) - نتائج (Outcome). مفيش 'تنظيم/Regulations'."},
{cat:"c1p1", q:"\"A way of thinking, reasoning, and acting\" describes entrepreneurship under which dimension?", opts:["Behaviour","Process","Outcome","Theory"], correct:0, trick:"التفكير والتصرف = سلوك (Behaviour) الشخص نفسه، مش عملية أو نتيجة."},
{cat:"c1p1", q:"The process dimension of entrepreneurship emphasizes:", opts:["Personal traits of entrepreneurs only","New development and implementation of innovation in business","Final products only","Government regulation"], correct:1, trick:"Process = عملية مستمرة من التطوير وتنفيذ الابتكار، مش مجرد صفة شخصية."},
{cat:"c1p1", q:"According to Mazuyka and Birley, which step comes FIRST in the entrepreneurship process?", opts:["Capturing greater value in the marketplace","Identifying and developing an opportunity in the form of a vision","Implementing the business concept","Extending the growth of the enterprise"], correct:1, trick:"البداية دايمًا 'رؤية' (Vision) — تحديد الفرصة الأول قبل أي تنفيذ."},
{cat:"c1p1", q:"The outcome dimension of entrepreneurship focuses on:", opts:["The entrepreneur's personality","The final results — goods or services","Theoretical definitions only","Risk-bearing only"], correct:1, trick:"Outcome = النتيجة النهائية، يعني إيه اللي طلع فعليًا: سلعة أو خدمة."},
{cat:"c1p1", q:"Which statement fits the \"outcome\" dimension of entrepreneurship?", opts:["\"a way of thinking, reasoning, and acting\"", "\"the dynamic force that facilitates the creation of incremental wealth\"", "\"identifying an opportunity in the form of a vision\"", "\"marshalling the required resources\""], correct:1, trick:"'القوة الديناميكية اللي بتخلق ثروة إضافية' = نتيجة ملموسة = Outcome."},
{cat:"c1p1", q:"Which of these best matches the \"process\" dimension definition given in the lecture?", opts:["\"the process of creating something new and of value by devoting time and effort, and assuming risk\"", "\"unique personal attributes and traits\"", "\"goods or services\"", "\"the impact of religion on society\""], correct:0, trick:"كلمة 'process of creating' نفسها بتقول إنه بُعد العملية (Process)."},
{cat:"c1p1", q:"According to the lecture, entrepreneurship creates value for:", opts:["Owners only", "Owners, participants, and stakeholders", "Government only", "Employees only"], correct:1, trick:"القيمة مش للمالك بس — بتتوزع على المالك والمشاركين وأصحاب المصلحة (Stakeholders) كمان."},
{cat:"c1p1", q:"The introduction of new economic activity through entrepreneurship leads to a change in the:", opts:["Wage agreement", "Marketplace", "Labor contract", "Workplace only"], correct:1, trick:"نشاط اقتصادي جديد = تغيير في 'السوق' (Marketplace) نفسه، مش بس مكان الشغل."},
{cat:"c1p1", q:"\"Capturing greater value in the marketplace\" is described in the lecture as part of:", opts:["The entrepreneurial process", "Wage labor", "The definition of unemployment", "Government budgeting"], correct:0, trick:"الاستحواذ على قيمة أكبر في السوق = خطوة من خطوات 'العملية الريادية' نفسها."},

// ===== Chapter 2 Part 1: Psychological =====
{cat:"c2p1", q:"A theory is defined in the lecture as:", opts:["A random guess","A set of interrelated constructs, definitions and propositions that explain phenomena","A government law","A business plan"], correct:1, trick:"النظرية = مجموعة أفكار مترابطة بتفسر وتتنبأ بالظواهر — مش تخمين عشوائي."},
{cat:"c2p1", q:"How many major perspectives of entrepreneurship theories are discussed across Chapter 2?", opts:["2","3","4","5"], correct:2, trick:"4 مناظير: نفسي (Psychological) - اجتماعي (Sociological) - اقتصادي (Economic) - إداري (Management)."},
{cat:"c2p1", q:"The Psychological Perspective views entrepreneurs as driven mainly by:", opts:["External market forces","Internal unique personal attributes and traits","Group dynamics","Government policy"], correct:1, trick:"نفسي = جوّاني (Internal) — سمات وقيم شخصية مش عوامل خارجية."},
{cat:"c2p1", q:"Which theorist is NOT associated with the Psychological Perspective?", opts:["David McClelland","Israel Kirzner","George Shackle","Max Weber"], correct:3, trick:"ماكس ويبر = عالم اجتماع، هيظهر في الفصل الاجتماعي مش النفسي."},
{cat:"c2p1", q:"David McClelland's Need-for-Achievement theory was put forward in:", opts:["1951","1961","1971","1981"], correct:1, trick:"مكليلاند 19-61 — احفظها كأنها 'حاجة سنة 61' للإنجاز."},
{cat:"c2p1", q:"According to McClelland, what mainly drives entrepreneurs to succeed?", opts:["Competence alone","The need for achievement, especially reinforced by cultural factors","Fear of failure","Government subsidy"], correct:1, trick:"'Need for Achievement' مش مجرد كفاءة (Competence) — دي رغبة داخلية للإنجاز مدعومة بعوامل ثقافية."},
{cat:"c2p1", q:"McClelland later shifted emphasis from the parent-child relationship toward:", opts:["Religion","Social and cultural factors","Financial capital only","Education level only"], correct:1, trick:"من دور 'الأم' لدور 'المجتمع والثقافة' — تطور فكره بمرور الوقت."},
{cat:"c2p1", q:"A major criticism of McClelland's theory is that it:", opts:["Ignores risk entirely","Did not emphasize the influence of the external environment on these drives","Focuses too much on economics","Is about groups not individuals"], correct:1, trick:"النقد الأساسي: الدافع الداخلي وحده مش كفاية، لازم بيئة خارجية 'تفعّله'."},
{cat:"c2p1", q:"The core concept in Israel Kirzner's theory of entrepreneurship is:", opts:["Alertness","Imagination","Need for achievement","Religion"], correct:0, trick:"كيرزنر = Alert-زنر، يعني رائد الأعمال 'متنبّه' للفرص اللي غيره مش شايفها."},
{cat:"c2p1", q:"Kirzner argues entrepreneurs balance supply and demand by:", opts:["Taking large loans","Detecting market imperfections and exploiting them","Following government regulation","Hiring more employees"], correct:1, trick:"لمّا يلاحظ 'عيب' أو فجوة في السوق (Market Imperfection)، بيستغلها ويوازن العرض والطلب."},
{cat:"c2p1", q:"Which of the following is a criticism of Kirzner's theory?", opts:["He believes entrepreneurial alertness cannot be taught","He overemphasizes imagination","He focuses too much on religion","He completely ignores alertness"], correct:0, trick:"كيرزنر شايف إن اليقظة (Alertness) موهبة مش بتتعلم — وده اللي اتنقد عليه."},
{cat:"c2p1", q:"George Shackle's theory centers on:", opts:["Creativity and imagination","Religion and ethics","Group solidarity","Insurable risk"], correct:0, trick:"شاكل = خيال وإبداع (Creativity & Imagination) في اكتشاف الفرص."},
{cat:"c2p1", q:"According to Shackle, business opportunities:", opts:["Exist objectively independent of the discoverer","Spring from the entrepreneur's imagination","Are created entirely by the government","Are purely inherited traits"], correct:1, trick:"الفرصة عند شاكل مالهاش وجود موضوعي منفصل — هي نابعة من 'خيال' مكتشفها."},
{cat:"c2p1", q:"A criticism of Shackle's theory is that it:", opts:["Is inconsistent with the evidence provided by phenomenologists and Gestalt psychologists","Ignores creativity entirely","Is purely economic","Focuses only on groups"], correct:0, trick:"علماء النفس الظاهراتي والجشطالت شافوا رأيه مش متسق مع أدلتهم العلمية."},
{cat:"c2p1", q:"George Shackle published his theory of creativity and imagination in:", opts:["1961","1965","1970","1982"], correct:2, trick:"شاكل 1970 — بعد كيرزنر بشوية، احفظها مع مكليلاند 61، كيرزنر بعده، شاكل 70."},

// ===== Chapter 2 Part 2: Sociological =====
{cat:"c2p2", q:"Sociological perspective theorists argue entrepreneurs are most likely to emerge under:", opts:["Specific personality traits","Specific social cultures","Government subsidy programs","Random chance"], correct:1, trick:"اجتماعي = القيم الثقافية والاجتماعية هي اللي 'بتولّد' رواد الأعمال."},
{cat:"c2p2", q:"Which theorist is NOT part of the Sociological Perspective?", opts:["Max Weber","Thomas Cochran","Frank Young","Frank Knight"], correct:3, trick:"فرانك نايت (Frank Knight) هيظهر بعدين في المنظور الاقتصادي — خليك واخد بالك من تشابه الأسماء."},
{cat:"c2p2", q:"Max Weber's theory of social change places emphasis on the impact of:", opts:["Religion","Technology","Group solidarity","Government policy"], correct:0, trick:"ويبر عالم اجتماع ألماني ركّز على تأثير 'الدين' على نشأة ريادة الأعمال."},
{cat:"c2p2", q:"According to Weber, which ethic promoted the \"spirit of capitalism\" and favored entrepreneurship?", opts:["Hindu ethics","Protestant ethics","Buddhist ethics","Confucian ethics"], correct:1, trick:"ويبر = الأخلاق البروتستانتية شجّعت الرأسمالية، وشاف إن الهندوسية معملتش كده."},
{cat:"c2p2", q:"A criticism of Weber's theory is that:", opts:["Capitalism has not flourished in some countries that practice religious ethics","It ignores religion entirely","It's too economic in nature","It focuses only on groups not individuals"], correct:0, trick:"في دول كتير بتمارس أخلاق دينية والرأسمالية معملتش نجاح زي ما ويبر توقع."},
{cat:"c2p2", q:"Thomas Cochran's Cultural Theory (1965) suggests entrepreneurs are:", opts:["Extraordinary or supernatural individuals","Role models shaped by social conditioning","Purely driven by profit motives only","Religious leaders"], correct:1, trick:"كوكران قال رائد الأعمال مش 'خارق' — هو 'قدوة' (Role Model) شكّلها المجتمع."},
{cat:"c2p2", q:"A criticism of Cochran's theory is that it:", opts:["Ignores the influence of risk, profit and innovation","Overemphasizes religion","Focuses too much on economics","Denies social factors matter"], correct:0, trick:"كوكران ركّز على العوامل الاجتماعية بس ونسي المخاطرة والربح والابتكار."},
{cat:"c2p2", q:"Frank W. Young's theory (1971) emphasizes:", opts:["Individual psychological traits","Group-level patterns conditioning entrepreneurial initiatives","Religious beliefs","Economic incentives"], correct:1, trick:"يونج = Young بيركز على 'الجروب' (المجموعة) مش الفرد لوحده."},
{cat:"c2p2", q:"Young rejected which type of interpretation of entrepreneurship?", opts:["Economic interpretation","Psychogenic interpretation","Sociological interpretation","Managerial interpretation"], correct:1, trick:"رفض التفسير النفسي (Psychogenic) لصالح تفسير المجموعات."},
{cat:"c2p2", q:"According to Young, entrepreneurial characteristics are observed in:", opts:["Isolated individuals only","Clusters, ethnic groups, occupational and political groups","Government institutions only","Religious sects only"], correct:1, trick:"مجموعات وتجمعات عرقية ومهنية وسياسية — مش فرد لوحده."},
{cat:"c2p2", q:"A major criticism of Young's theory is that it:", opts:["Overemphasizes individual thinking","Does not believe entrepreneurial activities could develop from individual critical thinking and imagination","Ignores groups entirely","Is too focused on religion"], correct:1, trick:"يونج متمسك إن بس المشاركة الجماعية هي اللي بتطوّر ريادة الأعمال، وده نقطة ضعف نظريته."},
{cat:"c2p2", q:"Max Weber was a:", opts:["German sociologist and economist","American psychologist","British economist","French philosopher"], correct:0, trick:"ألماني (German) — عالم اجتماع واقتصاد."},

// ===== Chapter 2 Part 3: Economic =====
{cat:"c2p3", q:"The Economic Perspective explores which factors enhance entrepreneurial behavior?", opts:["Economic conditions and incentives","Personality traits","Religious beliefs","Group dynamics"], correct:0, trick:"اقتصادي = شروط وحوافز اقتصادية زي الضرائب والتمويل والبنية التحتية."},
{cat:"c2p3", q:"Which of these is NOT listed as an economic incentive driving entrepreneurship in the lecture?", opts:["Taxation policy","Access to finance on favourable terms","Religious beliefs","Availability of technology and infrastructure"], correct:2, trick:"'المعتقدات الدينية' دي عامل اجتماعي (ويبر) مش اقتصادي."},
{cat:"c2p3", q:"Which theorist is NOT part of the Economic Perspective?", opts:["Joseph Schumpeter","Frank Knight","Harvey Leibenstein","Bert Hoselitz"], correct:3, trick:"بيرت هوسليتز (Hoselitz) هيظهر في المنظور الإداري مش الاقتصادي."},
{cat:"c2p3", q:"Schumpeter proposed his innovation theory of entrepreneurship in:", opts:["1939","1949","1959","1965"], correct:1, trick:"شومبيتر 1949 — ابتكار وتطوّر اقتصادي بعد الحرب العالمية التانية بسنين."},
{cat:"c2p3", q:"According to Schumpeter, entrepreneurs are best described as:", opts:["Ordinary managers","Individuals who introduce something entirely new (innovation)","Risk avoiders","Religious followers"], correct:1, trick:"شومبيتر = الابتكار (Innovation) هو جوهر رائد الأعمال، مش مجرد إدارة عادية."},
{cat:"c2p3", q:"Which of the following is NOT one of Schumpeter's five forms of innovation?", opts:["New Product","New Method of Production","New Market","Increased reliance on wage labor"], correct:3, trick:"أشكال الابتكار الخمسة: منتج جديد، طريقة إنتاج، سوق جديد، مصدر مواد خام، تنظيم إداري جديد — مفيش 'زيادة الاعتماد على العمالة بأجر'."},
{cat:"c2p3", q:"A major criticism of Schumpeter's theory is that it:", opts:["Completely ignores the risk-taking function of the entrepreneur","Overemphasizes risk-taking","Ignores innovation completely","Focuses only on religion"], correct:0, trick:"ركّز جدًا على الابتكار ونسي دور 'تحمل المخاطرة' تمامًا."},
{cat:"c2p3", q:"Frank Knight's book \"Risk, Uncertainty and Profit\" was published in:", opts:["1937","1947","1957","1967"], correct:2, trick:"نايت 1957 — الربح مقابل تحمّل عدم اليقين."},
{cat:"c2p3", q:"According to Knight, entrepreneurial profit is the reward for bearing:", opts:["Insurable risks only","Non-insurable risks and uncertainties","Government taxes","Group obligations"], correct:1, trick:"المخاطر اللي مينفعش تتأمن عليها (Non-insurable) زي تغير الأسعار والطلب."},
{cat:"c2p3", q:"Knight classifies risk into which two categories?", opts:["High and low risk","Insurable and non-insurable risk","Social and economic risk","Short-term and long-term risk"], correct:1, trick:"قابل للتأمين (زي الحريق والسرقة) وغير قابل للتأمين (زي تقلب الأسعار)."},
{cat:"c2p3", q:"Harvey Leibenstein introduced the theory of X-efficiency in:", opts:["1956","1966","1976","1986"], correct:1, trick:"ليبنشتاين 1966 — كفاءة استخدام الموارد جوه المنشأة."},
{cat:"c2p3", q:"Leibenstein identifies two main roles for the entrepreneur: a gap filler and:", opts:["An input completer","A risk taker","An innovator","A religious leader"], correct:0, trick:"'ساد الفجوة' (Gap Filler) و'مكمّل المدخلات' (Input Completer) — دورين مكملين لبعض."},
{cat:"c2p3", q:"According to Leibenstein, \"Routine Entrepreneurship\" deals with:", opts:["Creating an enterprise in undefined markets","Normal management functions in an ongoing business","Religious activities","Group solidarity"], correct:1, trick:"Routine = روتين = إدارة عادية لمنشأة قايمة بالفعل، عكس النوع الابتكاري."},
{cat:"c2p3", q:"Mark Casson's book \"The Entrepreneur — An Economic Theory\" was published in:", opts:["1972","1982","1992","2002"], correct:1, trick:"كاسون 1982 — بعد ليبنشتاين بـ16 سنة."},
{cat:"c2p3", q:"Casson defines an entrepreneur as someone who specializes in:", opts:["Making judgmental decisions about coordinating scarce resources","Religious teaching","Group leadership only","Bearing insurable risk only"], correct:0, trick:"كاسون = قرارات 'حكمية/تقديرية' (Judgmental) لتنسيق موارد نادرة."},

// ===== Chapter 2 Part 4: Management + Summary =====
{cat:"c2p4", q:"The Management Perspective views the entrepreneur primarily as:", opts:["An organizer of a business who assumes risk in establishing and managing it","A psychological type only","A religious follower","A group member only"], correct:0, trick:"إداري = منظّم (Organizer) للموارد والمخاطر في إنشاء وإدارة المنشأة."},
{cat:"c2p4", q:"Which theorist is NOT part of the Management Perspective?", opts:["Bert Hoselitz","Frederick Harbison","Max Weber","(both Hoselitz and Harbison are)"], correct:2, trick:"ماكس ويبر ظهر قبل كده في المنظور الاجتماعي — انتبه للتكرار!"},
{cat:"c2p4", q:"Hoselitz's theory of managerial skills and leadership was propounded in:", opts:["1942","1952","1962","1972"], correct:1, trick:"هوسليتز 1952 — مهارات إدارية وقيادية."},
{cat:"c2p4", q:"According to Hoselitz, financial skills have:", opts:["Primary importance in entrepreneurship","Only secondary consideration in entrepreneurship","No relation to entrepreneurship","The same importance as leadership skills"], correct:1, trick:"المهارات المالية مش الأهم عند هوسليتز — المهارات الإدارية والقيادية هي الأساس."},
{cat:"c2p4", q:"Hoselitz identifies three types of business leadership. Which of these is NOT one of them?", opts:["Merchant-money-lender type","Managerial type","Entrepreneurial type","Religious type"], correct:3, trick:"التلات أنواع: تاجر/مرابي - إداري - ريادي. مفيش نوع ديني."},
{cat:"c2p4", q:"A criticism of Hoselitz's theory is that it:", opts:["Did not provide information on how entrepreneurs could acquire managerial and leadership skills","Overemphasizes technical skills","Ignores leadership entirely","Focuses only on religion"], correct:0, trick:"قال المهارات دي مهمة بس ما وضّحش 'إزاي' تكتسبها."},
{cat:"c2p4", q:"Frederick Harbison propounded the theory of organization building in:", opts:["1955","1965","1975","1985"], correct:1, trick:"هاربيسون 1965 — بعد هوسليتز بـ13 سنة، ركّز على بناء المنظمة."},
{cat:"c2p4", q:"According to Harbison, the entrepreneur is best described as:", opts:["An innovator only","An 'organisation builder' who harnesses the ideas of different innovators","A risk-avoider","A religious leader"], correct:1, trick:"هاربيسون = 'باني المنظمة' اللي بيجمع أفكار المبتكرين التانيين مش هو نفسه المبتكر."},
{cat:"c2p4", q:"A criticism of Harbison's theory is that it:", opts:["Emphasizes organization building but doesn't explain the process of building it","Ignores organizations entirely","Focuses too much on religion","Denies managerial skills matter"], correct:0, trick:"قال 'بناء المنظمة' مهم بس ما شرحش 'إزاي' تُبنى فعليًا."},
{cat:"c2p4", q:"How many total perspectives (schools of thought) of entrepreneurship theories were covered across Chapter 2?", opts:["2","3","4","5"], correct:2, trick:"4 مناظير: نفسي - اجتماعي - اقتصادي - إداري. (تكرار مقصود عشان يترسخ!)"},
{cat:"c2p4", q:"According to the Chapter 2 summary, entrepreneurship theories mainly explain:", opts:["Government policies only","The motivation, behavior, and development of entrepreneurs","Stock market trends","Legal regulations of businesses"], correct:1, trick:"الخلاصة: النظريات بتفسر الدافع والسلوك وتطور رواد الأعمال من زوايا مختلفة."},

// ===== Chapter 3 Part 1: Concept, Types, Sources & Phases of Innovation =====
{cat:"c3p1", q:"Innovation is best described in the lecture as:", opts:["Something original and more effective that breaks into the market or society","A government regulation tool","An outcome of pure luck","A synonym for creativity"], correct:0, trick:"الابتكار = حاجة أصلية وأكتر فاعلية بتدخل السوق أو المجتمع بطريقة جديدة."},
{cat:"c3p1", q:"According to Luecke and Katz (2003), creativity is seen as:", opts:["The opposite of innovation","The basis for innovation","A government policy","Irrelevant to innovation"], correct:1, trick:"لوك وكاتز: الإبداع = الأساس اللي الابتكار بيتبني عليه."},
{cat:"c3p1", q:"In the lecture's view of creativity and innovation, creativity is:", opts:["A necessary but not sufficient condition for innovation","A sufficient condition on its own","Unrelated to innovation","The end result of innovation"], correct:0, trick:"الإبداع شرط 'لازم' بس مش 'كافي' لوحده — لازم تنفيذ كمان عشان يبقى ابتكار."},
{cat:"c3p1", q:"Which of the following is NOT listed as a benefit of innovation?", opts:["Expanding the customer base","Creating a good reputation","Charging at a premium","Eliminating all business risk"], correct:3, trick:"الابتكار بيدي مميزات كتير بس مش بيلغي المخاطرة خالص — دي مبالغة."},
{cat:"c3p1", q:"Which type of innovation involves relatively small modifications to preexisting technological competencies?", opts:["Incremental Innovation","Radical Innovation","Disruptive Innovation","Architectural Innovation"], correct:0, trick:"Incremental = تدريجي/بالتقسيط، يعني تعديلات صغيرة على اللي موجود بالفعل."},
{cat:"c3p1", q:"Architectural Innovation is best defined as:", opts:["Creating an entirely new enterprise","The reconfiguration of an established system with new linkages between components","A small routine modification","A change with no technological element"], correct:1, trick:"Architectural = زي إعادة تصميم المبنى — نفس القطع بس بترتيب واتصال جديد."},
{cat:"c3p1", q:"Radical Innovation is characterized by:", opts:["Small routine modifications","Creating revolutionary technology or breakthroughs and giving birth to new enterprises","Requiring no new business model","Ignoring technology completely"], correct:1, trick:"Radical = جذري، يعني ثورة تكنولوجية كاملة مش تعديل بسيط."},
{cat:"c3p1", q:"Disruptive Innovation requires:", opts:["A technological breakthrough only","A new business model, not necessarily a technological breakthrough","No change at all","A government subsidy"], correct:1, trick:"Disruptive = بيهز السوق بـ'موديل عمل جديد' مش لازم تكنولوجيا جديدة."},
{cat:"c3p1", q:"According to Drucker (1985), how many sources of innovation are identified?", opts:["Five","Six","Seven","Eight"], correct:2, trick:"دركر عنده 7 مصادر للابتكار — زي أيام الأسبوع، احفظها كده."},
{cat:"c3p1", q:"\"Unexpected Occurrences\" as a source of innovation refers to:", opts:["Unexpected successes and failures that are often overlooked","Planned government policy","Demographic shifts","New scientific knowledge"], correct:0, trick:"النجاحات والفشل 'الغير متوقع' كتير من الناس بتتجاهله — وده مصدر ابتكار مهم."},
{cat:"c3p1", q:"\"Incongruities\" as a source of innovation refer to:", opts:["Perfect alignment between expectations and results","Gaps within the logic of a process, or between assumptions and realities","Population growth","New legal regulations"], correct:1, trick:"Incongruity = عدم اتساق/تناقض بين المتوقع والواقع، وده بيفتح باب للابتكار."},
{cat:"c3p1", q:"\"New Knowledge\" as a source of innovation is described in the lecture as:", opts:["The least important source","The 'superstars of entrepreneurship'","Purely theoretical with no real impact","Only relevant to government projects"], correct:1, trick:"المعرفة الجديدة = 'نجوم' ريادة الأعمال — لما فروع معرفة مختلفة تتلاقى، الابتكار بيظهر."},
{cat:"c3p1", q:"According to Desouza and Jha (2007), how many essential phases of successful innovation are there?", opts:["Three","Four","Five","Six"], correct:2, trick:"ديسوزا وجها = 5 مراحل: توليد الفكرة، الدعوة والفرز، التجريب، التسويق، الانتشار والتنفيذ."},
{cat:"c3p1", q:"\"Mobilisation\", as one of the innovation phases, occurs when:", opts:["The idea stays with its original inventor in the same department", "A new idea is moved to a different physical or logical location within the organization", "The idea is abandoned entirely", "The prototype fails testing"], correct:1, trick:"Mobilisation = 'تحريك' الفكرة لمكان تاني (فيزيائي أو منطقي) — مش بقاؤها مكانها الأصلي."},
{cat:"c3p1", q:"The \"Experimentation\" phase of innovation mainly involves:", opts:["Assessing the sustainability of ideas via a prototype or trial and identifying the customer", "Generating the very first idea", "Screening ideas for costs only", "Diffusing the final product to all markets"], correct:0, trick:"Experimentation = تجربة الفكرة بنموذج أولي (Prototype) عشان تعرف تستمر ولا لأ ومين هيبقى العميل."},
{cat:"c3p1", q:"\"Implementation\", as an innovation phase, is defined as:", opts:["Setting up the structures, maintenance, and resources needed to produce an innovation", "Spreading the idea to the wider society only", "The very first stage of idea generation", "A synonym for Diffusion"], correct:0, trick:"Implementation = تجهيز البنية والموارد اللازمة لإنتاج الابتكار فعليًا — مش نفس معنى Diffusion."},
{cat:"c3p1", q:"In the phases of successful innovation, \"Commercialisation\" is the stage when:", opts:["The idea is first generated and a prototype is built", "The focus shifts from development to persuasion and creating market value", "The idea is screened for costs and benefits", "The innovation moves between departments"], correct:1, trick:"Commercialisation = مرحلة 'الإقناع' وخلق قيمة سوقية بعد التطوير، مش أول مراحل الابتكار."},

// ===== Chapter 3 Part 2: Change Management =====
{cat:"c3p2", q:"Change management is best defined as:", opts:["A random reaction to unexpected events","A systematic approach to dealing with transition or transformation of an organization's goals, processes or technologies","A financial audit tool","A marketing campaign"], correct:1, trick:"إدارة التغيير = منهج 'منظم' (Systematic) للتعامل مع التحول، مش رد فعل عشوائي."},
{cat:"c3p2", q:"The main purpose of change management is to:", opts:["Prevent any change from happening","Implement strategies for effecting and controlling change, and helping people adapt","Eliminate the need for planning","Increase resistance to change"], correct:1, trick:"الهدف: تنفيذ استراتيجيات للتحكم في التغيير ومساعدة الناس على التأقلم معاه."},
{cat:"c3p2", q:"Changes in raw materials, finance, processes, and employees are classified as:", opts:["External factors","Socio-cultural factors","Internal factors","Legal factors"], correct:2, trick:"دول كلهم جوه المنشأة نفسها = عوامل داخلية (Internal)."},
{cat:"c3p2", q:"Changes in values, norms, perception, lifestyle and demography are classified as:", opts:["Internal factors","Socio-cultural factors","Technological factors","Legal factors"], correct:1, trick:"القيم والعادات والسكان = عوامل اجتماعية-ثقافية (Socio-cultural)."},
{cat:"c3p2", q:"Among the critical change areas, sourcing more funds through grants, borrowing, or issuing shares relates to:", opts:["Finance","Labour","Structure","Markets"], correct:0, trick:"تمويل إضافي = مجال 'المالية' (Finance) من مجالات التغيير الحرجة."},
{cat:"c3p2", q:"Changing the employees' mix, number, and quality through recruitment or training relates to which critical change area?", opts:["Raw Materials","Labour","Technology","Management"], correct:1, trick:"العمالة (Labour) بتتغير بالتوظيف والتدريب والنقل."},
{cat:"c3p2", q:"Adoption of new and improved methods, machines, tools and processes relates to which critical change area?", opts:["Technology","Structure","Products","Finance"], correct:0, trick:"الأدوات والآلات والعمليات = مجال 'التكنولوجيا' (Technology)."},
{cat:"c3p2", q:"Changes in reporting relationships, coordination mechanisms, or job design fall under which critical change area?", opts:["Structure","Markets","Products","Raw Materials"], correct:0, trick:"علاقات التقارير والتنسيق والتصميم الوظيفي = مجال 'الهيكل' (Structure)."},
{cat:"c3p2", q:"Resistance to change is best defined as:", opts:["Enthusiastic acceptance of change","Refusal or reluctance to accept change, whether planned or not","A type of innovation","A financial strategy"], correct:1, trick:"المقاومة = رفض أو تردد في قبول التغيير، سواء كان مخطط له أو لأ."},
{cat:"c3p2", q:"According to Robbins (2018), a change that threatens an employee's economic status (e.g. demotion or job loss) tends to:", opts:["Increase enthusiasm for change","Invoke resistance to change","Have no effect on behavior","Only affect management, not employees"], correct:1, trick:"التهديد بفقدان الوظيفة أو التنزيل الوظيفي = مصدر مباشر لمقاومة التغيير."},
{cat:"c3p2", q:"Habit, as a source of individual resistance to change, is best described as:", opts:["Something easily broken once formed","A coping mechanism that is difficult to break once formed","Unrelated to resistance","Only relevant to organizations, not individuals"], correct:1, trick:"العادة (Habit) آلية تأقلم بس صعبة الكسر لما تترسخ، فبتبقى مصدر مقاومة."},
{cat:"c3p2", q:"\"Selective perception\" as a source of resistance to change means individuals:", opts:["Process all information equally without bias","Filter information according to their already established interests","Ignore their own interests completely","Always support organizational decisions"], correct:1, trick:"الإدراك الانتقائي = الشخص بيفهم المعلومات بناءً على مصالحه المترسخة مسبقًا، مش بشكل محايد."},
{cat:"c3p2", q:"Planned change, as opposed to unplanned change, is best described as:", opts:["Accidental and spontaneous","Intentional and goal-oriented","Impossible to manage","Always resisted"], correct:1, trick:"Planned = مخطط له ومقصود لتحقيق هدف، أما Unplanned فعرضي ومفاجئ."},
{cat:"c3p2", q:"\"Overt and immediate\" resistance to change typically takes the form of:", opts:["Deferred inaction and passive withdrawal months later","Complaints, work-to-rule, or strike action","Quiet non-compliance that's hard to detect","Subtle manipulation of reports"], correct:1, trick:"Overt = علني وفوري، زي الشكاوى أو الإضراب — سهل ملاحظته على عكس المقاومة الضمنية."},
{cat:"c3p2", q:"Implicit and deferred resistance to change, compared to overt and immediate resistance, is:", opts:["Easier to recognise and handle","More difficult to recognise and handle","Identical in nature to overt resistance","Non-existent in organizations"], correct:1, trick:"المقاومة الضمنية/المؤجلة أصعب في الاكتشاف والتعامل معاها من المقاومة العلنية الفورية."},
{cat:"c3p2", q:"An employee is likely to resist change when they fear it will:", opts:["Increase their salary","Reduce their control of information or resources","Improve their working hours","Have no effect on their role"], correct:1, trick:"الخوف من فقدان السيطرة على 'المعلومات أو الموارد' = مصدر مباشر لمقاومة التغيير."},
{cat:"c3p2", q:"Contractual obligations, as a source of organizational resistance to change, legally restrict organizations from:", opts:["Recruiting new employees without approval","Pursuing contrary lines of action within the duration of such obligations","Changing their product offerings to customers","Expanding into new markets"], correct:1, trick:"الالتزامات التعاقدية بتمنع المنظمة من التصرف بعكس الاتفاق طول مدة العقد."},

// ===== Chapter 3 Part 3: Organisational Resistance, Strategies & Technical Change =====
{cat:"c3p3", q:"Viewing an organization as a social system with interrelated and interdependent parts explains resistance to change because:", opts:["Changes in one sub-system cannot be effective without affecting other parts","All parts of an organization are completely independent","Social systems cannot change at all","This applies only to small organizations"], correct:0, trick:"المنظمة نظام اجتماعي مترابط، فأي تغيير في جزء بيأثر على باقي الأجزاء."},
{cat:"c3p3", q:"Strong, inflexible organizational cultures are considered a source of resistance to change because:", opts:["They are always easy to change","They are like habits, difficult to change","They have no relation to change","They only exist in small firms"], correct:1, trick:"الثقافة التنظيمية القوية = زي العادة، صعبة التغيير."},
{cat:"c3p3", q:"Which type of organizational structure offers well-defined lines of authority and stability, but its rigidity can resist change?", opts:["Organic structure","Mechanistic structure","Matrix structure","Flat structure"], correct:1, trick:"Mechanistic = ميكانيكي/جامد، مستقر لكن مقاوم للتغيير بسبب صلابته."},
{cat:"c3p3", q:"Which type of organizational structure is described as more adaptable to organizational change?", opts:["Mechanistic structure","Organic structure","Bureaucratic structure","Hierarchical structure"], correct:1, trick:"Organic = عضوي/مرن، عكس الميكانيكي، أكتر قابلية للتكيف مع التغيير."},
{cat:"c3p3", q:"The \"Education and Communication\" strategy for dealing with resistance to change focuses on:", opts:["Forcing employees to accept change","Educating people about the change effort beforehand and explaining reasons and means","Bringing resistors into a symbolic role only","Threatening employees with job loss"], correct:1, trick:"التعليم والتواصل = شرح الأسباب والوسائل 'قبل' حصول التغيير."},
{cat:"c3p3", q:"\"Participation and Involvement\" as a change strategy emphasizes:", opts:["Excluding affected employees from decisions","Full involvement of those affected by the proposed change","Symbolic roles with no real influence","Legal coercion"], correct:1, trick:"المشاركة = إشراك 'كامل' لكل الناس اللي هيتأثروا بالتغيير."},
{cat:"c3p3", q:"\"Facilitation and Support\" as a change strategy involves:", opts:["Providing special training, counselling and time off work","Bargaining and negotiating concessions","Symbolic inclusion of resistance leaders","Explicit threats of job loss"], correct:0, trick:"التيسير والدعم = تدريب خاص ومشورة وإجازات لمساعدة الموظفين وقت التغيير."},
{cat:"c3p3", q:"\"Co-optation and Manipulation\" as a change strategy involves:", opts:["Genuine full participation of all employees","Bringing a resistor's leader into the planning group for appearances rather than substantive contribution","Direct force and coercion","Hiring an external expert to decide"], correct:1, trick:"Co-optation = إدخال قائد المعارضين للمجموعة 'شكليًا' بس مش بمشاركة حقيقية."},
{cat:"c3p3", q:"The \"Directive Strategy\" for managing change relies mainly on:", opts:["The entrepreneur's authority to impose change with little involvement of others","Full negotiation with all employees","An external expert's technical judgment","Symbolic inclusion of resistors"], correct:0, trick:"Directive = توجيهي، يعني رائد الأعمال بيفرض التغيير بسلطته بأقل مشاركة من غيره."},
{cat:"c3p3", q:"A technical change, as defined in the lecture, refers to:", opts:["A change purely in marketing strategy","A change in business operation in terms of the amount of output relative to the amount of input","A change in company logo only","A change in employee dress code"], correct:1, trick:"التغيير التقني = علاقة كمية 'المخرجات' بكمية 'المدخلات' في العملية الإنتاجية."},
{cat:"c3p3", q:"The \"Expert Strategy\" for dealing with resistance to change is mainly applied to:", opts:["Emotional conflicts between employees","More technical problems, led by a specialist project team or senior manager","Symbolic inclusion of resistance leaders","Financial negotiations only"], correct:1, trick:"Expert Strategy = للمشاكل 'التقنية' زي نظام معلومات جديد، وبيقودها فريق متخصص."},
{cat:"c3p3", q:"The \"Negotiation and Agreement\" strategy for managing resistance to change involves:", opts:["Accepting concessions and adjustments to win acceptance","Forcing change through threats of job loss","Providing special training only","Explaining the change to all employees at once"], correct:0, trick:"التفاوض والاتفاق = تقديم تنازلات وتعديلات عشان تكسب موافقة الطرف التاني."},
{cat:"c3p3", q:"The \"Coercion\" strategy for dealing with resistance to change involves:", opts:["Full negotiation and mutual agreement","Explicit or implicit threats of job loss or non-promotion","Bringing resistors into a planning group","Providing counselling and time off"], correct:1, trick:"Coercion = إكراه، يعني تهديد صريح أو ضمني بفقدان الوظيفة أو الترقية."}
];

let filtered = [];
let answers = {}; // { questionIndex: { chosen: idx, isCorrect: bool } }
let activeCat = "all";
const PAGE_SIZE = 10;
let currentPage = 0;

const filtersEl = document.getElementById('filters');
const statsRow = document.getElementById('statsRow');
const startBtn = document.getElementById('startBtn');
const setupScreen = document.getElementById('setupScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');
const progressBar = document.getElementById('progressBar');
const scoreBadge = document.getElementById('scoreBadge');
const questionsContainer = document.getElementById('questionsContainer');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');
const pageIndicator = document.getElementById('pageIndicator');

function buildFilters(){
  const allChip = document.createElement('div');
  allChip.className = 'chip active';
  allChip.textContent = `All (${QUESTIONS.length})`;
  allChip.dataset.cat = 'all';
  filtersEl.appendChild(allChip);
  Object.keys(CATS).forEach(k=>{
    const count = QUESTIONS.filter(q=>q.cat===k).length;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = `${CATS[k]} (${count})`;
    chip.dataset.cat = k;
    filtersEl.appendChild(chip);
  });
  filtersEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      filtersEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      updateStats();
    });
  });
}

function updateStats(){
  const count = activeCat==='all' ? QUESTIONS.length : QUESTIONS.filter(q=>q.cat===activeCat).length;
  statsRow.innerHTML = `Available questions: <b>${count}</b>`;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

startBtn.addEventListener('click', ()=>{
  filtered = shuffle(activeCat==='all' ? QUESTIONS : QUESTIONS.filter(q=>q.cat===activeCat));
  if(filtered.length===0) return;
  answers = {};
  currentPage = 0;
  setupScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  resultScreen.classList.add('hidden');
  renderPage();
});

function totalPages(){
  return Math.ceil(filtered.length / PAGE_SIZE);
}

function renderPage(){
  questionsContainer.innerHTML = '';
  const start = currentPage * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, filtered.length);

  for(let i = start; i < end; i++){
    const item = filtered[i];
    const block = document.createElement('div');
    block.className = 'question-block';

    const catTag = document.createElement('div');
    catTag.className = 'cat-tag';
    catTag.textContent = CATS[item.cat];
    block.appendChild(catTag);

    const qText = document.createElement('div');
    qText.className = 'question';
    qText.textContent = `${i + 1}. ${item.q}`;
    block.appendChild(qText);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';
    const existingAnswer = answers[i];

    item.opts.forEach((opt, idx)=>{
      const btn = document.createElement('div');
      btn.className = 'option';
      btn.textContent = opt;
      btn.dataset.q = i;
      btn.dataset.opt = idx;
      if(existingAnswer){
        btn.classList.add('locked');
        if(idx === item.correct) btn.classList.add('correct');
        if(idx === existingAnswer.chosen && idx !== item.correct) btn.classList.add('wrong');
      }
      btn.addEventListener('click', (e)=> selectOption(i, idx, e.currentTarget));
      optsWrap.appendChild(btn);
    });
    block.appendChild(optsWrap);

    const trickBox = document.createElement('div');
    trickBox.className = 'trick-box';
    if(existingAnswer){
      trickBox.style.display = 'block';
      trickBox.innerHTML = `<b>💡 تريكة للحفظ:</b><br>${item.trick}`;
    }
    block.appendChild(trickBox);

    questionsContainer.appendChild(block);
  }

  updateProgress();
  pageIndicator.textContent = `Page ${currentPage + 1} / ${totalPages()}`;
  prevPageBtn.disabled = currentPage === 0;
  nextPageBtn.textContent = (currentPage === totalPages() - 1) ? 'Show Results 🏁' : 'Next 10 ➡';
}

const GOOD_MESSAGES = ['🔥 جامد!', '👏 برافو!', '🎯 تمام!', '💪 كده يا وحش!', '⭐ ممتاز!', '✅ عاش يا بطل!', '🚀 جبار!'];
const BAD_MESSAGE = '❌ فاشل';

function showFeedback(btnEl, isCorrect){
  if(!btnEl) return;
  const pop = document.createElement('div');
  pop.className = 'feedback-pop ' + (isCorrect ? 'good' : 'bad');
  pop.textContent = isCorrect
    ? GOOD_MESSAGES[Math.floor(Math.random() * GOOD_MESSAGES.length)]
    : BAD_MESSAGE;
  btnEl.appendChild(pop);
  setTimeout(()=> pop.remove(), 1200);
}

function selectOption(qIdx, optIdx, btnEl){
  if(answers[qIdx]) return;
  const item = filtered[qIdx];
  const isCorrect = optIdx === item.correct;
  answers[qIdx] = { chosen: optIdx, isCorrect };
  renderPage();
  const newBtn = questionsContainer.querySelector(`.option[data-q="${qIdx}"][data-opt="${optIdx}"]`);
  showFeedback(newBtn, isCorrect);
}

function updateProgress(){
  const answeredCount = Object.keys(answers).length;
  const correctCount = Object.values(answers).filter(a=>a.isCorrect).length;
  progressBar.style.width = `${(answeredCount / filtered.length) * 100}%`;
  scoreBadge.textContent = `${correctCount} / ${filtered.length}`;
}

prevPageBtn.addEventListener('click', ()=>{
  if(currentPage > 0){
    currentPage--;
    renderPage();
  }
});

nextPageBtn.addEventListener('click', ()=>{
  if(currentPage === totalPages() - 1){
    showResults();
  } else {
    currentPage++;
    renderPage();
  }
});

function showResults(){
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');

  const score = Object.values(answers).filter(a=>a.isCorrect).length;
  const wrongAnswers = Object.entries(answers)
    .filter(([,a])=>!a.isCorrect)
    .map(([qIdx,a])=>{
      const item = filtered[qIdx];
      return { q: item.q, chosen: item.opts[a.chosen], correct: item.opts[item.correct] };
    });

  const pct = Math.round((score/filtered.length)*100);
  document.getElementById('resultScore').textContent = `${pct}%`;
  document.getElementById('resultSub').textContent = `Your correct answers: ${score} out of ${filtered.length}`;
  const emojiEl = document.getElementById('resultEmoji');
  emojiEl.textContent = pct>=85 ? '🏆' : pct>=60 ? '🎉' : pct>=40 ? '💪' : '📚';

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  if(wrongAnswers.length>0){
    const heading = document.createElement('div');
    heading.style.cssText = 'font-weight:700; margin: 14px 0 10px; color:#374151;';
    heading.textContent = `Review of questions you got wrong (${wrongAnswers.length}):`;
    reviewList.appendChild(heading);
    wrongAnswers.forEach(w=>{
      const div = document.createElement('div');
      div.className = 'review-item wrong';
      div.innerHTML = `<div class="rq">${w.q}</div><div class="ra">Your answer: <span class="bad">${w.chosen}</span> — Correct: <span class="good">${w.correct}</span></div>`;
      reviewList.appendChild(div);
    });
  } else {
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center; color:#166534; font-weight:700; padding: 10px;';
    div.textContent = 'Excellent! You got every question right 🎯';
    reviewList.appendChild(div);
  }
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  resultScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
});

buildFilters();
updateStats();
</script>
</body>
</html>
